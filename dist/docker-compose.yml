# ============================================================
# 發布版 compose —— 這份是要放進下載壓縮檔的
#
# 跟開發用的那份最大的差別：這裡是 image: 不是 build:。
# 使用者不需要原始碼、不需要裝 Python / Node / MySQL，
# 只要有 Docker，docker compose up 就會自己去 GHCR 抓現成的 image。
# ============================================================

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-drug_prevention_db}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 放在這個目錄的 .sql 會在「資料庫第一次建立時」自動執行。
      # 用來塞展示用的種子資料（帳號、白名單範例）。
      # ⚠️ 不要放真實爬到的可疑網址或蒐證資料，那是要跟著程式一起公開下載的。
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    image: ghcr.io/luke930828/tku-drug-detection/backend:${VERSION:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-drug_prevention_db}
      NLP_BASE_URL: http://nlp:8000
      YOLO_BASE_URL: http://yolo:5000
      CRAWLER_BASE_URL: http://crawler:8001
      BACKEND_SELF_URL: http://127.0.0.1:8000
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-10}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy

  crawler:
    image: ghcr.io/luke930828/tku-drug-detection/crawler:${VERSION:-latest}
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      backend:
        condition: service_healthy

  nlp:
    image: ghcr.io/luke930828/tku-drug-detection/nlp:${VERSION:-latest}
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      backend:
        condition: service_healthy

  yolo:
    image: ghcr.io/luke930828/tku-drug-detection/yolo:${VERSION:-latest}
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://backend:8000
      MODEL_PATH: /models/best.pt
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    volumes:
      # 權重檔太大不能包進 image 也不能進 git，
      # 使用者要另外從 Release 頁面下載 weights.zip 解壓到這裡
      - ./models:/models:ro
    depends_on:
      backend:
        condition: service_healthy
    # 沒有 NVIDIA GPU 的電腦要跑的話，把整個 yolo 服務改用 profiles 關掉，
    # 或改成 CPU 版 image（見 README 的「沒有顯卡怎麼辦」）
    profiles: ["gpu"]

  frontend:
    image: ghcr.io/luke930828/tku-drug-detection/frontend:${VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql-data:
