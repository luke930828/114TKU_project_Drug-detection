server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：找不到檔案就回 index.html，否則重新整理會 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 把 /api 轉給後端。src/auth.ts 的 API_BASE_URL 是空字串，
    # 前端一律打自己的 /api/...，完全不需要知道後端在哪台機器，
    # 也就順便解決了 CORS。換 local / tailscale 只要改這個 proxy_pass 目標。
    #
    # 127.0.0.11 是 Docker 內建 DNS。用變數 + resolver 讓 nginx 每次請求才解析，
    # 不要在啟動當下就解析一次快取住——backend 容器還沒起來、或之後重啟換了 IP，
    # 寫死的 proxy_pass 會直接讓 nginx 整個啟動失敗，或是一直打舊 IP。
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # YOLO 回傳的 base64 圖片欄位（representative_image_base64）可能很大
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }
}
