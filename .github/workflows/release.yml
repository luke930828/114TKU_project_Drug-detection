name: Release

# 打一個 tag 就出一版：v1.0.0
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# ⚠️ GHCR 的 image 名稱必須全小寫，但你們 repo 名有大寫（114TKU_...）。
#    所以下面用 IMAGE_PREFIX 手動指定，不要直接用 ${{ github.repository }}。
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/luke930828/tku-drug-detection

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [backend, frontend, crawler, nlp, yolo]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: ./modules/${{ matrix.module }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:latest
          # 跨 build cache，第二次之後會快很多
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,scope=${{ matrix.module }},mode=max

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 組裝下載包
        run: |
          mkdir -p out/drug-detection-${{ github.ref_name }}
          cp -r dist/* out/drug-detection-${{ github.ref_name }}/
          # 把 compose 裡的版本號釘死成這次的 tag，
          # 這樣使用者下載到的 zip 永遠對應同一組 image，不會因為 latest 飄掉
          sed -i "s|\${VERSION:-latest}|${{ github.ref_name }}|g" \
            out/drug-detection-${{ github.ref_name }}/docker-compose.yml
          cd out && zip -r ../drug-detection-${{ github.ref_name }}.zip .

      - name: 建立 Release
        uses: softprops/action-gh-release@v2
        with:
          files: drug-detection-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ## 安裝方式

            1. 下載下面的 `drug-detection-${{ github.ref_name }}.zip` 並解壓縮
            2. 確認電腦已安裝 [Docker Desktop](https://www.docker.com/products/docker-desktop/)
            3. Windows 點兩下 `start.bat`；macOS / Linux 執行 `./start.sh`
            4. 瀏覽器開 http://localhost:8080

            第一次啟動要下載 image，視網速大約 5-15 分鐘。之後啟動只要幾秒。

            ### 需要 YOLO 影像辨識的話
            另外下載 `weights.zip`，解壓後把 `best.pt` 放進 `models/` 資料夾再啟動。
